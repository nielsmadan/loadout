# Synthetic manifest. Declares one of every wiring shape the expected output has
# to prove — see docs/reference/coverage.md, "Covered only by whole-document
# comparison". Not a copy of anyone's real manifest.

[[source]]
name = "test"
path = "."

# Takes turns writing ~/.harness-a/PRIMARY.md with `primary-variant`. Two targets
# may share a destination only when their profiles make them mutually exclusive,
# so this pair is what covers that rule.
[instructions.primary]
output       = "out/primary.md"
destinations = ["~/.harness-a/PRIMARY.md"]
profile      = "default"
order        = ["intro", "policy", "shared", "closing"]

# Destination-only: no in-repo output at all. Swaps one fragment for its
# `.variant` sibling, which is how a profile changes one block and nothing else.
[instructions.primary-variant]
destinations = ["~/.harness-a/PRIMARY.md"]
profile      = "variant"
order        = ["intro", "policy.variant", "shared", "closing"]

# Both output and destinations, and more than one destination, so the fan-out is
# covered. No profile, so it renders under every profile. The second destination is
# env-templated: conftest clears LOADOUT_TEST_HARNESS_C, so it takes the fallback and
# resolves to the same path a literal would — which is what keeps the expected tree
# machine-independent while still routing the fixture through the expansion path.
[instructions.shared]
output       = "out/shared.md"
destinations = ["~/.harness-b/SHARED.md", "${LOADOUT_TEST_HARNESS_C:-~/.harness-c}/SHARED.md"]
order        = ["intro", "shared", "closing"]

[permissions.claude]
output   = "perm/claude.json"
render   = "claude"
# The settings slice by name — byte-identical to the `base` path spelling it
# replaced, which is what proves the two are one input.
settings = "claude"

# rules = [] selects nothing, so all three lists render empty — the autonomous
# profile's mechanism.
[permissions.claude-empty]
output   = "perm/claude-empty.json"
render   = "claude"
# Two fragments composing: the delta adds a key and merges into a nested map
# rather than replacing it — a 208-line copy expressed as one small overlay.
settings = ["claude", "claude-afk"]
rules    = []

[permissions.claude-mcp]
output = "perm/claude-mcp.json"
render = "claude-mcp"

[permissions.codex]
output = "perm/codex.rules"
render = "codex"

[permissions.codex-mcp]
output = "perm/codex-mcp.toml"
render = "codex-mcp"

# The co-owned shape: a base plus a foreign key carried through from the file
# being overwritten.
[permissions.opencode]
output   = "perm/opencode.json"
render   = "opencode"
base     = "bases/opencode.base.json"
preserve = ["foreign"]

[permissions.pi]
output = "perm/pi.json"
render = "pi"
