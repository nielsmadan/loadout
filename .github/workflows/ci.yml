name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.10"
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked --group docs
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Check formatting
        run: uv run --no-sync ruff format --check
      - name: Type check
        run: uv run --no-sync mypy
      - name: Unit tests
        run: uv run --no-sync pytest -q -m "not integration and not migration_integration"
      - name: Build documentation
        run: uv run --no-sync zensical build -f mkdocs.yml --strict

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.10"
          python-version: "3.13"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Integration tests
        run: uv run --no-sync pytest -q -m "integration and not migration_integration"

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.10"
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Migration integration tests
        run: uv run --no-sync pytest -q -m migration_integration

  check:
    if: always()
    needs: [unit, integration, migration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$MIGRATION_RESULT" = success
