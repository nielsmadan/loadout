name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: loadout-release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: nielsmadan/curtaincall@v1.2.0
      - name: Validate annotated tag and ancestry
        id: identity
        run: |
          RELEASE_COMMIT=$(curtains ci validate-tag "$RELEASE_TAG" "$GITHUB_SHA")
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.8.10"
          python-version: "3.13"
      - name: Check tap configuration
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Set HOMEBREW_TAP_TOKEN in this repository's Actions secrets before releasing."
            exit 1
          fi
      - name: Verify release version and lockfile
        run: |
          python3 scripts/prepare_release.py "${RELEASE_TAG#v}" --check
          uv lock --check
      - name: Build source archive and wheel
        run: uv build
      - name: Exercise the installed wheel
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/loadout-tool/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/loadout-tool/bin
        run: |
          uv tool install --python 3.13 dist/*.whl
          "$UV_TOOL_DIR/loadout/bin/python" tests/manual/verify_installation.py \
            "$RUNNER_TEMP/loadout-tool" "$RUNNER_TEMP/loadout-install-check"
      - name: Prepare Homebrew formula
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/loadout-source.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          source_sha=$(shasum -a 256 "$RUNNER_TEMP/loadout-source.tar.gz" | cut -d' ' -f1)
          python3 scripts/homebrew.py render "${RELEASE_TAG#v}" "$source_sha" loadout.rb
      - name: Install and test through Homebrew
        run: |
          brew tap-new --no-git nielsmadan/loadout-release-test
          cp loadout.rb "$(brew --repository nielsmadan/loadout-release-test)/Formula/loadout.rb"
          brew install --build-from-source nielsmadan/loadout-release-test/loadout
          brew test nielsmadan/loadout-release-test/loadout
      - name: Generate release notes
        run: |
          uvx git-cliff@2.13.1 --current --strip all --output "$RUNNER_TEMP/release-notes.md"
          sed '/^## \[/d' "$RUNNER_TEMP/release-notes.md" > release-notes.md
          PREV_TAG=$(curtains ci previous-tag "$RELEASE_TAG")
          if [ -n "$PREV_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV_TAG" "$RELEASE_TAG" >> release-notes.md
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-package
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            loadout.rb
            release-notes.md

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ needs.package.outputs.release-commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nielsmadan/curtaincall@v1.2.0
      - name: Revalidate release tag
        run: test "$(curtains ci validate-tag "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: release-assets
      - name: Publish GitHub release
        run: |
          curtains ci publish "$RELEASE_TAG" "$RELEASE_COMMIT" \
            --notes release-assets/release-notes.md release-assets/dist/*

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: release-assets
      - uses: actions/checkout@v7.0.1
        with:
          repository: nielsmadan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          FORMULA_ACTION=$(python3 release-tools/scripts/homebrew.py publish \
            release-assets/loadout.rb homebrew-tap/Formula/loadout.rb)
          if [ "$FORMULA_ACTION" = "skipped-newer" ]; then
            echo "A newer Homebrew formula is already published"
            exit 0
          fi
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/loadout.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update loadout to ${RELEASE_TAG#v}"
          git push origin HEAD:main
