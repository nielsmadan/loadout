[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadout"
version = "0.1.0"
description = "One source of truth for AI coding-agent configuration, rendered to every harness."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
license = "MIT"
authors = [{ name = "Niels Madan" }]

[project.scripts]
loadout = "loadout:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "ruff>=0.16.0", "mypy>=2.3.0"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
files = ["src/loadout"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["loadout"]
branch = true
omit = ["*/__main__.py"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/loadout"]
