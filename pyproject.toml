[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadout"
version = "0.10.0"
description = "One source of truth for AI coding-agent configuration, rendered to every harness."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "shtab>=1.13.0",
    "tomlkit>=0.15.2",
]
license = "MIT"
authors = [{ name = "Niels Madan" }]

[project.scripts]
loadout = "loadout:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-cov>=5", "ruff>=0.17.3", "mypy>=2.4.1"]
docs = [
    "zensical==0.0.74",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
files = ["src/loadout"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: exercises multiple components, a CLI/subprocess, packaging, or a transactional workflow",
    "migration_integration: exercises real Git migration, backup, or restore flows",
]

[tool.coverage.run]
source = ["loadout"]
branch = true
omit = ["*/__main__.py"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/loadout"]
